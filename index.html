<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#1d2940}
button,input,select,textarea{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111b2c}
.card{background:white;padding:35px;border-radius:16px;width:100%;max-width:420px}
h1{margin-top:0;color:#24375c}
input,select,textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #dce1eb;border-radius:8px}
button{border:0;border-radius:8px;padding:12px 17px;background:#315ee8;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#244bc5}
.layout{display:none;min-height:100vh}
aside{width:230px;background:#111b2c;color:white;padding:25px;float:left;min-height:100vh}
aside h2{font-size:21px;margin-bottom:45px}
aside p{color:#b9c5da}
main{margin-left:230px;padding:35px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}
.stat,.task{background:white;padding:20px;border-radius:12px;border:1px solid #e5e9f0}
.stat strong{display:block;font-size:30px;margin-top:10px}
.task{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}
.task p{color:#68758a;font-size:13px}
.task select{max-width:210px;margin:0}
.modal{background:white;padding:22px;border-radius:12px;margin:20px 0;max-width:600px;display:none}
.msg{padding:12px;background:#fff2d9;border-radius:8px;margin:12px 0}
small{color:#8490a3}
@media(max-width:700px){
aside{float:none;width:100%;min-height:auto;padding:15px}
aside h2{margin:0}
main{margin:0;padding:18px}
.stats{grid-template-columns:1fr}
.task{align-items:flex-start;flex-direction:column}
.task select{max-width:none}
}
</style>
</head>
<body>

<section class="login" id="login">
<div class="card">
<h1>Marketing Hub</h1>
<p>Entre com seu acesso da equipe.</p>
<form id="loginForm">
<label>E-mail</label>
<input id="email" type="email" required placeholder="Seu e-mail">
<label>Senha</label>
<input id="password" type="password" required placeholder="Sua senha">
<button style="width:100%">Entrar</button>
</form>
<div id="loginMsg"></div>
</div>
</section>

<div class="layout" id="app">
<aside>
<h2>Marketing Hub</h2>
<p>▦ Painel inicial</p>
<p>☷ Tarefas</p>
<p>◉ WhatsApp <small>Em breve</small></p>
<p>◷ Histórico</p>
<hr>
<p id="userName">Usuário</p>
<button onclick="sair()">Sair</button>
</aside>

<main>
<div class="top">
<div>
<small>VISÃO GERAL</small>
<h1>Painel inicial</h1>
</div>
<button onclick="abrirFormulario()">+ Nova tarefa</button>
</div>

<div class="stats">
<div class="stat">Tarefas cadastradas<strong id="total">0</strong></div>
<div class="stat">Em aberto<strong id="abertas">0</strong></div>
<div class="stat">Concluídas<strong id="concluidas">0</strong></div>
</div>

<div class="modal" id="formulario">
<h2>Nova tarefa</h2>
<form id="taskForm">
<label>Nome da tarefa</label>
<input id="titulo" required placeholder="Ex.: Criar arte para campanha">
<label>Descrição</label>
<textarea id="descricao" rows="3" placeholder="Detalhes da tarefa"></textarea>
<label>Responsável</label>
<select id="responsavel"></select>
<label>Prazo</label>
<input id="prazo" type="date">
<button>Salvar tarefa</button>
<button type="button" onclick="fecharFormulario()" style="background:#e5e9f0;color:#24375c">Cancelar</button>
</form>
</div>

<h2>Tarefas da equipe</h2>
<div id="tarefas"></div>
<div id="aviso"></div>
</main>
</div>

<script>
const URL_SUPABASE = "https://zhogacaeqdgsippmheba.supabase.co";
const CHAVE_PUBLICA = "sb_publishable_QLm-O-yq8ESYzokA2qq1Ug_Pa5mSBDV";

const db = window.supabase.createClient(URL_SUPABASE, CHAVE_PUBLICA);
let usuario = null;
let perfil = null;
let equipe = [];
let tarefas = [];

document.getElementById("loginForm").addEventListener("submit", async e => {
 e.preventDefault();
 mensagem("loginMsg","Entrando...");
 const {data,error} = await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });
 if(error){
  mensagem("loginMsg","Não foi possível entrar: "+error.message);
  return;
 }
 usuario=data.user;
 await iniciar();
});

async function iniciar(){
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";

 const resultado=await db.from("profiles")
  .select("id,name,role").eq("id",usuario.id).maybeSingle();

 if(resultado.error || !resultado.data){
  mensagem("aviso","Não encontramos seu perfil. Confira o cadastro no Supabase.");
  return;
 }
 perfil=resultado.data;
 document.getElementById("userName").textContent=perfil.name;
 await carregarEquipe();
 await carregarTarefas();

 db.channel("tarefas-ao-vivo")
 .on("postgres_changes",
 {event:"*",schema:"public",table:"tasks"},
 ()=>carregarTarefas())
 .subscribe();
}

async function carregarEquipe(){
 const {data,error}=await db.from("profiles")
 .select("id,name").order("name");
 if(error){mensagem("aviso",error.message);return;}
 equipe=data||[];
 const campo=document.getElementById("responsavel");
 campo.innerHTML='<option value="">Não atribuído</option>';
 equipe.forEach(p=>{
  campo.innerHTML+=`<option value="${p.id}">${escapar(p.name)}</option>`;
 });
}

async function carregarTarefas(){
 const {data,error}=await db.from("tasks")
 .select("*").order("created_at",{ascending:false});
 if(error){mensagem("aviso",error.message);return;}
 tarefas=data||[];
 mostrarTarefas();
}

function mostrarTarefas(){
 document.getElementById("total").textContent=tarefas.length;
 document.getElementById("abertas").textContent=tarefas.filter(t=>t.status!=="Concluída").length;
 document.getElementById("concluidas").textContent=tarefas.filter(t=>t.status==="Concluída").length;

 const area=document.getElementById("tarefas");
 if(!tarefas.length){
  area.innerHTML="<p>Nenhuma tarefa cadastrada ainda.</p>";
  return;
 }
 area.innerHTML=tarefas.map(t=>{
  const nome=equipe.find(p=>p.id===t.assigned_to)?.name||"Não atribuído";
  return `<div class="task">
  <div><strong>${escapar(t.title)}</strong>
  <p>${escapar(t.description||"Sem descrição")}</p>
  <small>Responsável: ${escapar(nome)} | Prazo: ${t.due_date?new Date(t.due_date+"T12:00:00").toLocaleDateString("pt-BR"):"Não definido"}</small></div>
  <select onchange="mudarStatus('${t.id}',this.value)">
  ${["Não iniciada","Em andamento","Aguardando aprovação","Concluída"].map(s=>`<option ${t.status===s?"selected":""}>${s}</option>`).join("")}
  </select></div>`;
 }).join("");
}

async function criarTarefa(e){
 e.preventDefault();
const {error}=await db.from("tasks").insert({
  title:document.getElementById("titulo").value,
  description:document.getElementById("descricao").value,
  assigned_to:document.getElementById("responsavel").value||null,
  due_date:document.getElementById("prazo").value||null,
  created_by:usuario.id
 });
 if(error){mensagem("aviso","Erro ao salvar: "+error.message);return;}
 document.getElementById("taskForm").reset();
 fecharFormulario();
 await carregarTarefas();
 mensagem("aviso","Tarefa criada com sucesso!");
}
document.getElementById("taskForm").addEventListener("submit",criarTarefa);

async function mudarStatus(id,status){
const {error}=await db.from("tasks").update({status}).eq("id",id);
 if(error){mensagem("aviso",error.message);return;}
 await carregarTarefas();
}

function abrirFormulario(){document.getElementById("formulario").style.display="block";}
function fecharFormulario(){document.getElementById("formulario").style.display="none";}
async function sair(){
 await db.auth.signOut();
 location.reload();
}
function mensagem(id,texto){document.getElementById(id).textContent=texto;}
function escapar(texto){
 return String(texto).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
